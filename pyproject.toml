    "airportsdata>=20260905",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "httpx>=0.27.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-mcp-adapters>=0.3.2",
